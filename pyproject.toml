[project]
name = "teyvat-chronicle-pipeline"
version = "0.1.0"
description = "Narration, score and data pipeline for the Teyvat Chronicle lore video"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "soundfile>=0.13",
    "fonttools>=4.55",
    "pillow>=11.0",
    "matplotlib>=3.9",
    "pyloudnorm>=0.1.1",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "pypinyin>=0.55",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
